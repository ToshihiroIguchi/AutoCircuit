<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoCircuit</title>
    <!-- Inline, so the page asks the network for nothing it cannot get from itself. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta
      name="description"
      content="Equivalent circuit analysis of impedance data, without user-supplied initial values."
    />
    <!-- There is deliberately no <link rel="preload"> for the numpy and scipy wheels here, and
         the reason is measured rather than assumed: the wheels are fetched by `loadPackage`
         inside the Web Worker, and a document's preload cache does not serve a worker's fetch,
         so Chrome asked for all 17 MB a second time. The worker-side version of the same idea
         was then built and measured too, and made the *total* cold start worse -- see the
         comment at the top of `src/worker/bridge.worker.ts`. -->
    <!-- The theme is stamped here, before the first paint, so someone who asked for a dark page
         does not get a white one for the second it takes the bundle to arrive -- let alone for the
         several it takes Pyodide to. src/core/theme.ts applies the same rule for every later
         change; this is the one place the rule is written twice, and that is what it buys. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("autocircuit.theme");
        } catch (error) {
          // Storage can be unavailable; the system preference is still a good answer.
        }
        document.documentElement.dataset.theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
  </head>
  <body>
    <!-- What is on screen between the first paint and React's first render.

         Not a spinner for its own sake: the bundle is fetched, parsed and mounted before any of
         the application's own loading states exist, and until then #root is empty, so a first
         visit met a blank white page and then a page that looked finished but was not
         (see src/components/StatusBar.tsx for the measurement). This is the honest first frame;
         `createRoot(...).render()` removes it. Styled inline because the stylesheet is in the
         bundle this is waiting for. -->
    <div id="root">
      <div class="boot-splash">
        <strong>AutoCircuit</strong>
        <span>Loading — the page is not ready yet.</span>
      </div>
    </div>
    <style>
      .boot-splash {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 24px;
        padding: 12px 14px;
        border-radius: 4px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        border: 1px solid rgb(0 0 0 / 12%);
        background: rgb(0 0 0 / 3%);
      }
      :root[data-theme="dark"] .boot-splash {
        color: #d7dae0;
        border-color: rgb(255 255 255 / 14%);
        background: rgb(255 255 255 / 5%);
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
