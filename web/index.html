<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoCircuit</title>
    <!-- Inline, so the page asks the network for nothing it cannot get from itself. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d4ed8'/%3E%3Cpath d='M4 20h6l3-9 4 14 3-9 2 4h6' fill='none' stroke='white' stroke-width='2.5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Equivalent circuit analysis of impedance data, without user-supplied initial values."
    />
    <!-- The theme is stamped here, before the first paint, so someone who asked for a dark page
         does not get a white one for the second it takes the bundle to arrive -- let alone for the
         thirteen it takes Pyodide to. src/core/theme.ts applies the same rule for every later
         change; this is the one place the rule is written twice, and that is what it buys. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("autocircuit.theme");
        } catch (error) {
          // Storage can be unavailable; the system preference is still a good answer.
        }
        document.documentElement.dataset.theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
