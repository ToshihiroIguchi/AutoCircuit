<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoCircuit</title>
    <!-- Inline, so the page asks the network for nothing it cannot get from itself. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta
      name="description"
      content="Equivalent circuit analysis of impedance data, without user-supplied initial values."
    />
    <!-- There is deliberately no <link rel="preload"> for the numpy and scipy wheels here.
         [measured] It was tried and it downloads them twice: the wheels are fetched by
         `loadPackage` inside the Web Worker, and a document's preload cache does not serve a
         worker's fetch -- Chrome logs "preloaded ... but not used" and asks for all 17 MB again.
         The overlap that change was after is done in `src/worker/bridge.worker.ts` instead,
         where the fetch that needs it lives. See docs/METRICS_AND_UX_PLAN.md section 1. -->
    <!-- The theme is stamped here, before the first paint, so someone who asked for a dark page
         does not get a white one for the second it takes the bundle to arrive -- let alone for the
         thirteen it takes Pyodide to. src/core/theme.ts applies the same rule for every later
         change; this is the one place the rule is written twice, and that is what it buys. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("autocircuit.theme");
        } catch (error) {
          // Storage can be unavailable; the system preference is still a good answer.
        }
        document.documentElement.dataset.theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
