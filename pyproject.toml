[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocircuit"
version = "0.1.0"
description = "Equivalent circuit analysis of passive-component frequency characteristics, without user-supplied initial values."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
autocircuit = "autocircuit.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8", "scipy-stubs>=1.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
# The package supports 3.11 (see requires-python), but mypy cannot be *told* 3.11 here: the
# stubs shipped inside numpy >= 2.3 use `type X = ...` statements, which are 3.12 syntax, so
# checking under 3.11 fails while parsing numpy itself rather than this project. The source
# uses no 3.12-only syntax, and `from __future__ import annotations` is on everywhere, so
# 3.11 support is a packaging claim tested by running the suite, not by this checker.
python_version = "3.12"
packages = ["autocircuit"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true
