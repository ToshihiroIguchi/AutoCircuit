[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocircuit"
version = "0.1.0"
description = "Equivalent circuit analysis of passive-component frequency characteristics, without user-supplied initial values."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
autocircuit = "autocircuit.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8", "scipy-stubs>=1.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
# Matches requires-python. It did not always: the floor was 3.11 while this said 3.12, because
# the stubs shipped inside numpy >= 2.3 use `type X = ...` statements and asking mypy for 3.11
# fails while parsing *numpy*, before it reaches this project. Nothing was checking 3.11 and
# nothing was running it either, so the claim came down to meet what is actually verified
# rather than the type checker being argued up to meet the claim.
python_version = "3.12"
packages = ["autocircuit"]
mypy_path = "src"
warn_unused_ignores = true
disallow_untyped_defs = true
